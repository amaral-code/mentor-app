# Cloudflare Worker - servidor da IA do Midnight Mentor
#
# Três ambientes (veja docs/ambientes.md):
#   npx wrangler dev                       -> dev local (segredos em .dev.vars)
#   npx wrangler deploy --env staging      -> midnight-mentor-ia-staging
#   npx wrangler deploy --env production   -> midnight-mentor-ia (produção)
#
# `npx wrangler deploy` SEM --env publica o worker de dev, nunca o de produção.
#
# Segredos (nunca aqui, só via `wrangler secret put <NOME> --env <ambiente>`):
#   DEEPSEEK_API_KEY, GEMINI_API_KEY, API_TOKEN, SUPABASE_URL,
#   SUPABASE_SERVICE_KEY, RESEND_API_KEY, GOOGLE_TTS_KEY,
#   MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET
# Cada ambiente tem os seus: staging aponta para o Supabase de staging.
#
# Atenção: `vars` NÃO são herdadas entre ambientes no wrangler;
# por isso cada bloco [env.*.vars] repete todas as variáveis.

name = "midnight-mentor-ia-dev"
main = "server/worker.js"
compatibility_date = "2025-01-01"

# ------------------------------------------------------------------ dev
[vars]
# Provedor padrão quando o app não diz qual usar (o chat manda
# provider+model, mas quiz/redação antigos e chamadas diretas caem aqui).
# Sem isso o worker assumia Gemini e quebrava tudo sem GEMINI_API_KEY.
AI_PROVIDER = "deepseek"
AI_MODEL = "deepseek-v4-flash"
ALLOWED_ORIGIN = "http://localhost:5173"
PUBLIC_APP_URL = "http://localhost:5173"

# ------------------------------------------------------------------ staging
[env.staging]
name = "midnight-mentor-ia-staging"

[env.staging.vars]
AI_PROVIDER = "deepseek"
AI_MODEL = "deepseek-v4-flash"
# Troque pelo endereço do app de staging quando ele existir.
ALLOWED_ORIGIN = "*"
# PUBLIC_APP_URL (links dos e-mails): defina aqui ou como secret, nunca nos dois.

# ------------------------------------------------------------------ produção
[env.production]
# Mesmo nome do worker já publicado: mantém a URL e os segredos atuais.
name = "midnight-mentor-ia"

[env.production.vars]
AI_PROVIDER = "deepseek"
AI_MODEL = "deepseek-v4-flash"
# Troque pelo domínio final assim que existir (issue de domínio próprio).
# Enquanto for "*", a senha API_TOKEN continua exigida nas rotas sensíveis.
ALLOWED_ORIGIN = "*"
# PUBLIC_APP_URL (links dos e-mails): defina aqui ou como secret, nunca nos dois.
