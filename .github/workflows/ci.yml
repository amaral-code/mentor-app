name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela execuções antigas do mesmo PR quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  segredos:
    name: Segredos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/verificar-segredos.mjs

  qualidade:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Tipos (tsc)
        run: npm run typecheck
      # Inclui os testes do worker (server/__tests__) e as migrations
      # rodadas num Postgres real com PGlite (supabase/__tests__).
      - name: Testes (vitest)
        run: npm test
      - name: Build
        run: npx vite build
