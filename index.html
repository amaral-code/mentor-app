<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      Viewport travado no mobile: sem maximum-scale/user-scalable=no, o
      duplo toque da zoom e o Safari impõe o atraso de 300ms no clique
      (botao "morto"). viewport-fit=cover estende sob o notch/Dynamic
      Island; as safe-areas ja sao tratadas nas classes safe-area-*.
      Nota de acessibilidade: o zoom por pinca e compensado pelo controle
      de tamanho de fonte em Perfil > Acessibilidade (aplicado antes da
      primeira pintura em main.tsx).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!--
      Content Security Policy.

      Limita o estrago de um XSS: mesmo que alguem consiga injetar script,
      ele nao carrega codigo de fora nem envia os dados para um servidor
      qualquer. Sem isso, qualquer falha de injecao vira exfiltracao.

      style-src precisa de 'unsafe-inline' porque o app usa style={{...}}
      em varios componentes (atributo inline conta como inline style).
      script-src NAO tem 'unsafe-inline': isso e o que de fato barra XSS.

      Se voce configurar VITE_AI_BASE_URL, acrescente o dominio do worker
      em connect-src.

      frame-ancestors NAO entra aqui: o navegador ignora essa diretiva
      quando ela vem por <meta> (so vale como cabecalho HTTP) e ainda
      registra um erro no console. Configure no servidor que publica o
      site, junto de X-Frame-Options.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        img-src 'self' data: blob: https://*.supabase.co;
        font-src 'self' data: https://fonts.gstatic.com;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co https://generativelanguage.googleapis.com;
        base-uri 'self';
        form-action 'self';
        object-src 'none'
      "
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!--
      Fonte via <link>, nao via @import no CSS.

      Um @import dentro da folha de estilo so comeca a baixar depois que o
      CSS chega: e um round-trip encadeado que atrasa a primeira pintura.
      Com preconnect o handshake acontece em paralelo, e display=swap deixa
      o texto aparecer na fonte do sistema enquanto a Plus Jakarta Sans
      carrega. JetBrains Mono cobre trechos de codigo e gabaritos.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <title>Midnight Mentor: Mentor ENEM</title>

    <!--
      Favicon desenhado, nao emoji.
      O emoji renderizava diferente em cada sistema (Apple, Windows,
      Android desenham a lua de um jeito), entao a marca nunca era a mesma.
      Lua ambar sobre o fundo midnight do app.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1120'/%3E%3Cpath d='M21.5 20.2a7.2 7.2 0 0 1-9.7-9.7 7.6 7.6 0 1 0 9.7 9.7z' fill='%23f59e0b'/%3E%3Ccircle cx='23' cy='9.5' r='1.3' fill='%23fbbf24'/%3E%3C/svg%3E"
    />
    <!--
      PWA (equivale ao metadata do layout.tsx no Next.js: aqui o <head>
      vive no index.html, unica pagina do SPA).

      manifest.json + theme-color + apple-touch-icon. O status bar
      translucido combina com o fundo midnight (#020617) em fullscreen.
    -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mentor" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
